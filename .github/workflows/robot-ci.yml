name: Robot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run smoke tests
        run: robot -d results ci/robot/smoke.robot

      - name: Validate parallel object execution
        run: robot -d results-parallel ci/robot/parallel_smoke.robot

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check Python style
        run: ruff check src tests ci/fakes

      - name: Check Robot Framework style
        run: robocop check src/robot ci/robot

      - name: Validate production suite syntax
        run: robot --dryrun -d results-dryrun src/robot/orchestrator/scan.robot

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            results/
            results-parallel/
            results-dryrun/
          if-no-files-found: ignore
