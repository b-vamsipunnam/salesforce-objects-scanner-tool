name: Robot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run smoke tests
        run: robot -d results ci/robot/smoke.robot

      - name: Validate parallel object execution
        run: robot -d results-parallel ci/robot/parallel_smoke.robot

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check Python style
        run: ruff check src tests ci/fakes

      - name: Check Robot Framework style
        run: robocop check src/robot ci/robot

      - name: Validate production suite syntax
        run: robot --dryrun -d results-dryrun src/robot/orchestrator/scan.robot

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            results/
            results-parallel/
            results-dryrun/
          if-no-files-found: ignore
