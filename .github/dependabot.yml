version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    groups:
      robot-framework:
        patterns:
          - robotframework
          - robotframework-pabot
          - robotframework-robocop
      python-tooling:
        patterns:
          - ruff
          - openpyxl
